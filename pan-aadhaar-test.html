<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SUNIL MULTI HUB — Find PAN by Aadhaar</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f7f9fc;color:#172033}
    .wrap{max-width:620px;margin:0 auto;padding:22px}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(15,23,42,.06)}
    h1{margin:0 0 6px;font-size:28px}.sub{margin:0 0 22px;color:#667085}.fee{font-weight:700;color:#2855cc}
    label{display:block;font-weight:800;margin-bottom:8px}.input{width:100%;box-sizing:border-box;padding:15px;border:1px solid #d7dee8;border-radius:13px;font-size:18px}
    .hint{display:block;margin-top:7px;color:#667085}.btn{width:100%;min-height:54px;margin-top:18px;border:0;border-radius:14px;background:linear-gradient(90deg,#0d64e8,#6047f5);color:#fff;font-size:18px;font-weight:800}
    .btn:disabled{opacity:.6}.result{display:none;margin-top:16px;padding:15px;border:1px solid #dfe5ee;border-radius:14px;background:#f8fafc;line-height:1.7}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.back{text-decoration:none;color:#2855cc;font-weight:700}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top"><strong>SUNIL MULTI HUB</strong><a class="back" href="dashboard.html">← Dashboard</a></div>
    <section class="card">
      <h1>PAN कार्ड सेवाएँ</h1>
      <p class="sub">Find PAN by Aadhaar · <span class="fee">Assistance Fee: ₹50</span></p>
      <label for="aadhaar">Aadhaar Number *</label>
      <input id="aadhaar" class="input" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="12 digit Aadhaar Number">
      <small class="hint">केवल 12 अंकों का Aadhaar Number भरें।</small>
      <button id="lookup" class="btn" type="button">🔎 Find PAN by Aadhaar — ₹50</button>
      <div id="result" class="result"></div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL='https://zktobzhvyxiclvyqnjco.supabase.co';
    const SUPABASE_KEY='sb_publishable_IvYEQWxo1jrQo8O5gayraw_wXAJj7JH';
    const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
    const input=document.getElementById('aadhaar');
    const btn=document.getElementById('lookup');
    const result=document.getElementById('result');
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    input.addEventListener('input',()=>input.value=input.value.replace(/\D/g,'').slice(0,12));
    (async()=>{const {data:{session}}=await sb.auth.getSession();if(!session) location.replace('auth.html');})();
    btn.addEventListener('click',async()=>{
      const aadhaar=input.value.replace(/\D/g,'');
      if(!/^\d{12}$/.test(aadhaar)){alert('12 digit Aadhaar Number भरें');return;}
      btn.disabled=true;btn.textContent='PAN खोज रहे हैं...';result.style.display='block';result.innerHTML='<b>कृपया प्रतीक्षा करें...</b>';
      try{
        const {data,error}=await sb.functions.invoke('aadhaar-pan-lookup',{body:{aadhaar}});
        if(error) throw error;
        if(!data?.success) throw new Error(data?.message||'PAN lookup failed');
        result.innerHTML='<div style="font-weight:800;color:#15803d">✅ PAN Data Found</div>'+
          '<div><strong>PAN Number:</strong> '+esc(data.data?.pan||'')+'</div>'+
          '<div><strong>Aadhaar:</strong> XXXX-XXXX-'+aadhaar.slice(-4)+'</div>'+
          '<div><strong>Status:</strong> '+esc(data.data?.status||'SUCCESS')+'</div>'+
          (data.charged?'<div style="margin-top:8px;color:#027a48;font-weight:700">₹'+esc(data.amount||50)+' wallet से debit हुआ।</div>':'');
      }catch(e){result.innerHTML='<div style="color:#b42318;font-weight:700">'+esc(e?.context?.body?.message||e?.message||'PAN lookup failed')+'</div>';}
      finally{btn.disabled=false;btn.textContent='🔎 Find PAN by Aadhaar — ₹50';}
    });
  </script>
</body>
</html>
