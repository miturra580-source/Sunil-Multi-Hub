<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SUNIL MULTI HUB — Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="phase2.css">
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="brand">
      <span class="brand-mark">SM</span>
      <span><strong>SUNIL MULTI HUB</strong><small>Admin Panel</small></span>
    </a>
    <button id="logoutBtn" class="btn secondary">Logout</button>
  </div>
</header>

<main class="admin-page">
  <div class="container">
    <section class="admin-head">
      <div>
        <span class="eyebrow">ADMIN</span>
        <h1>Admin Dashboard</h1>
        <p id="loggedIn">Checking admin access…</p>
      </div>
      <div class="dashboard-actions">
        <a class="btn primary" href="tools.html">Open Tools</a>
        <button class="btn secondary" id="refreshBtn">Refresh Data</button>
      </div>
    </section>

    <div class="stat-grid">
      <article><span>Orders</span><strong id="ordersCount">0</strong></article>
      <article><span>Services</span><strong id="servicesCount">0</strong></article>
      <article><span>Users</span><strong id="usersCount">0</strong></article>
      <article><span>Revenue</span><strong id="revenueCount">₹0</strong></article>
    </div>

    <section class="admin-card">
      <div class="card-head">
        <div><h2>Orders</h2><p>Customer requests और status manage करें।</p></div>
      </div>
      <div id="ordersWrap"></div>
    </section>

    <section class="admin-card">
      <div class="card-head">
        <div><h2>Services</h2><p>Supabase service list manage करें।</p></div>
        <button class="btn primary" id="addServiceBtn">+ Add Service</button>
      </div>
      <div id="servicesWrap"></div>
    </section>

    <section class="admin-card">
      <h2>Users</h2>
      <div id="usersWrap"></div>
    </section>

    <section class="admin-card">
      <h2>API / Database Status</h2>
      <p><span id="apiBadge" class="status pending">Checking…</span></p>
      <small id="apiText">Connecting to Supabase…</small>
    </section>
  </div>
</main>

<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
