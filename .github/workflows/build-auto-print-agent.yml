name: Build Auto Print Agent
on:
  workflow_dispatch:
  push:
    paths:
      - "agent/SunilAutoPrintAgent/**"
      - ".github/workflows/build-auto-print-agent.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restore packages
        run: nuget restore agent/SunilAutoPrintAgent/packages.config -PackagesDirectory agent/packages
      - name: Build Release
        run: msbuild agent/SunilAutoPrintAgent/SunilAutoPrintAgent.csproj /p:Configuration=Release /p:Platform=AnyCPU
      - name: Add PDF printing engine and release notes
        shell: pwsh
        run: |
          choco install sumatrapdf.install -y --no-progress
          $sumatra = Get-ChildItem "C:\Program Files\SumatraPDF\SumatraPDF.exe","C:\Program Files (x86)\SumatraPDF\SumatraPDF.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sumatra) { throw "Installed SumatraPDF.exe was not found" }
          Copy-Item $sumatra.FullName agent/SunilAutoPrintAgent/bin/Release/SumatraPDF.exe
          Copy-Item agent/SunilAutoPrintAgent/README.md agent/SunilAutoPrintAgent/bin/Release/README.md
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path agent/SunilAutoPrintAgent/bin/Release/* -DestinationPath MULTI-HUB-24-Auto-Print-Agent.zip -Force
      - name: Upload Agent
        uses: actions/upload-artifact@v4
        with:
          name: MULTI-HUB-24-Auto-Print-Agent
          path: agent/SunilAutoPrintAgent/bin/Release/
          if-no-files-found: error
      - name: Publish latest Windows Agent
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-print-agent-latest
          name: MULTI HUB 24 Auto Print Agent
          body: Portable Windows Agent for MULTI HUB 24 Auto Print. Extract the ZIP, run MultiHub24AutoPrintAgent.exe, paste the one-time Device Token, select the printer, and start the agent.
          make_latest: true
          files: MULTI-HUB-24-Auto-Print-Agent.zip
