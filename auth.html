<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MULTI HUB 24 — Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="phase2.css">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <a href="index.html" class="brand auth-brand">
      <span class="brand-mark">M24</span>
      <span><strong>MULTI HUB 24</strong><small>Secure Login</small></span>
    </a>

    <section class="auth-card">
      <div class="tabs" id="authTabs">
        <button class="tab active" data-tab="login">Login</button>
        <button class="tab" data-tab="register">Register</button>
      </div>

      <form id="loginForm" class="auth-form active">
        <h1>लॉगिन</h1>
        <p>अपने account से dashboard खोलें।</p>
        <label>Email<input type="email" id="loginEmail" required></label>
        <label>Password<input type="password" id="loginPassword" required minlength="6"></label>
        <button class="btn primary full" type="submit">Login</button>
        <button class="btn secondary full" id="googleLoginBtn" type="button">Continue with Google</button>
        <button class="link-btn" id="forgotBtn" type="button">Forgot password?</button>
      </form>

      <form id="registerForm" class="auth-form">
        <h1>नया अकाउंट</h1>
        <p>Customer account बनाएं।</p>
        <label>नाम<input type="text" id="regName" required></label>
        <label>Email<input type="email" id="regEmail" required></label>
        <label>मोबाइल<input type="tel" id="regPhone" required></label>
        <label>Password<input type="password" id="regPassword" required minlength="6"></label>
        <button class="btn primary full" type="submit">Register</button>
      </form>

      <form id="recoveryForm" class="auth-form">
        <h1>नया Password सेट करें</h1>
        <p>कम से कम 6 characters का नया password रखें।</p>
        <label>New Password<input type="password" id="newPassword" required minlength="6" autocomplete="new-password"></label>
        <label>Confirm Password<input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password"></label>
        <button class="btn primary full" type="submit">Update Password</button>
      </form>

      <div class="api-box">
        <span id="apiDot"></span>
        <strong id="apiText">Checking Supabase…</strong>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js?v=20260824-1"></script>
</body>
</html>
